#####################################################################
# Voron 2.4r2 350
# Manta M8P v2.0 + CB1 (CAN)
# EBB SB2209 CAN (RP2040)
# TAP probe | Physical X/Y endstops | PT1000 via MAX31865
#####################################################################

[include KAMP_Settings.cfg]   # adaptive mesh + LINE_PURGE — lives on printer at ~/printer_data/config/
[include mainsail.cfg]        # auto-managed by Mainsail — do not edit
[exclude_object]              # enables per-object cancel in slicer
[include timelapse.cfg]

#####################################################################
# MCUs
#####################################################################

[mcu]
canbus_uuid: 7cbf8eef4543    # Manta M8P — run: python3 ~/klipper/scripts/canbus_query.py can0 to find
canbus_interface: can0

[mcu EBBCan]
canbus_uuid: fa817e71ef41    # EBB SB2209 toolhead board
canbus_interface: can0

#####################################################################
# Printer Limits
#####################################################################

[printer]
kinematics: corexy
max_velocity: 350
max_accel: 7000              # restored after belt fix
minimum_cruise_ratio: 0.5   # short moves still reach ~50% of max_accel before decelerating
max_z_velocity: 20
max_z_accel: 300
square_corner_velocity: 6.0  # raised from 3.0 — safe with input shaping dialed in

[temperature_sensor MP8]
sensor_type: temperature_mcu
sensor_mcu: mcu

[temperature_sensor CB1]
sensor_type: temperature_host

[temperature_sensor EBB]
sensor_type: temperature_mcu
sensor_mcu: EBBCan

#####################################################################
# X/Y Steppers
#####################################################################

## X - Motor1 (B Motor)
[stepper_x]
step_pin: PE6
dir_pin: PE5
enable_pin: !PC14
microsteps: 16               # higher than Z (16) for smoother XY motion
rotation_distance: 40
full_steps_per_rotation: 200 # 1.8° motors — change to 400 for 0.9°
endstop_pin: ^EBBCan:gpio24  # physical endstop on toolhead board
position_min: 0
position_endstop: 350
position_max: 350
homing_speed: 120
homing_retract_dist: 3
homing_positive_dir: true

[tmc2209 stepper_x]
uart_pin: PC13
interpolate: false           # off = cleaner motion at high accel (no interpolation artifacts)
run_current: 1.0
sense_resistor: 0.110
stealthchop_threshold: 0     # spreadCycle mode — better for dynamic CoreXY moves

## Y - Motor2 (A Motor)
[stepper_y]
step_pin: PE2
dir_pin: PE1
enable_pin: !PE4
microsteps: 16
rotation_distance: 40
full_steps_per_rotation: 200
endstop_pin: ^PF3            # physical endstop on M8P
position_min: 0
position_endstop: 350
position_max: 350
homing_speed: 100
homing_retract_dist: 3
homing_positive_dir: true

[tmc2209 stepper_y]
uart_pin: PE3
interpolate: false
run_current: 1.0
sense_resistor: 0.110
stealthchop_threshold: 0

#####################################################################
# Z Steppers (Quad Gantry)
# Layout: Z0=front-left, Z1=rear-left, Z2=rear-right, Z3=front-right
#####################################################################

## Z0 - Front Left - Motor3
[stepper_z]
step_pin: PB8
dir_pin: PB7
enable_pin: !PE0
rotation_distance: 40
gear_ratio: 80:16            # leadscrew gear reduction
microsteps: 16
endstop_pin: probe:z_virtual_endstop  # TAP acts as Z endstop
position_max: 340
position_min: -2             # small negative allows z_offset fine-tuning below zero
homing_speed: 20
second_homing_speed: 8       # slow final approach for accuracy
homing_retract_dist: 2

[tmc2209 stepper_z]
uart_pin: PB9
interpolate: true            # OK for Z — slower speeds don't show artifacts
run_current: 1.0
hold_current: 0.6            # reduce heat when idle holding gantry
sense_resistor: 0.110
stealthchop_threshold: 0

## Z1 - Rear Left - Motor5
[stepper_z1]
step_pin: PB4
dir_pin: !PB3
enable_pin: !PB6
rotation_distance: 40
gear_ratio: 80:16
microsteps: 16

[tmc2209 stepper_z1]
uart_pin: PB5
interpolate: true
run_current: 1.0
hold_current: 0.6
sense_resistor: 0.110
stealthchop_threshold: 0

## Z2 - Rear Right - Motor6
[stepper_z2]
step_pin: PG13
dir_pin: PG12
enable_pin: !PG15
rotation_distance: 40
gear_ratio: 80:16
microsteps: 16

[tmc2209 stepper_z2]
uart_pin: PG14
interpolate: true
run_current: 1.0
hold_current: 0.6
sense_resistor: 0.110
stealthchop_threshold: 0

## Z3 - Front Right - Motor7
[stepper_z3]
step_pin: PG9
dir_pin: !PD7
enable_pin: !PG11
rotation_distance: 40
gear_ratio: 80:16
microsteps: 16

[tmc2209 stepper_z3]
uart_pin: PG10
interpolate: true
run_current: 1.0
hold_current: 0.6
sense_resistor: 0.110
stealthchop_threshold: 0

#####################################################################
# Extruder (Clockwork 2 on SB2209)
#####################################################################

[extruder]
step_pin: EBBCan:gpio18
dir_pin: EBBCan:gpio19
enable_pin: !EBBCan:gpio17
microsteps: 16
rotation_distance: 21.8864   # calibrated — default is 22.6789; tune with e-steps cal
gear_ratio: 50:10            # CW2 gear ratio
nozzle_diameter: 0.400
filament_diameter: 1.750
min_extrude_temp: 150
min_temp: 0
max_temp: 280
max_extrude_only_distance: 105
max_extrude_cross_section: 5

heater_pin: EBBCan:gpio7
max_power: 1.0
pressure_advance: 0.04       # starting value — tune per filament with PA calibration print
pressure_advance_smooth_time: 0.04

# PT1000 via MAX31865 (2-wire, software SPI on EBBCan)
sensor_type: MAX31865
sensor_pin: EBBCan:gpio9
spi_speed: 400000
spi_software_sclk_pin: EBBCan:gpio10
spi_software_mosi_pin: EBBCan:gpio8
spi_software_miso_pin: EBBCan:gpio11
rtd_nominal_r: 1000          # PT1000 = 1000Ω at 0°C
rtd_reference_r: 4300        # reference resistor on MAX31865 board
rtd_num_of_wires: 2
rtd_use_50hz_filter: false
smooth_time: 0.5

[tmc2209 extruder]
uart_pin: EBBCan:gpio20
run_current: 0.65            # pancake motor — rated ~1A, 0.65 runs cool and reliable
interpolate: false
stealthchop_threshold: 0

[gcode_arcs]
resolution: 0.1              # enables G2/G3 arc support — set arc fitting in OrcaSlicer to match

#####################################################################
# Bed Heater
#####################################################################

[heater_bed]
heater_pin: PA1
sensor_pin: PB1
sensor_type: Generic 3950
max_power: 1.0
min_temp: 0
max_temp: 115                # silicone bed — safe ceiling, don't raise

#####################################################################
# Probe (Voron TAP)
# TAP uses the nozzle as the probe — no XY offset needed.
# ! on pin required: EBBCan GPIO logic is inverted on this board.
# Recalibrate z_offset after any nozzle change: run PROBE_CALIBRATE
#####################################################################

[probe]
pin: ^EBBCan:gpio22          # ^ = pull-up; no inversion needed for this TAP/EBBCan combo
speed: 5
lift_speed: 15
samples: 3                   # take 3 samples and use median — more reliable than single sample
samples_result: median
sample_retract_dist: 3.0
samples_tolerance: 0.020     # retry if samples spread more than 0.01mm
samples_tolerance_retries: 5

activate_gcode:
  # Cools nozzle to 150°C before probing — prevents ooze from interfering with TAP trigger
  {% set PROBE_TEMP = 150 %}
  {% set MAX_TEMP = PROBE_TEMP + 5 %}
  {% set ACTUAL_TEMP = printer.extruder.temperature %}
  {% set TARGET_TEMP = printer.extruder.target %}
  {% if TARGET_TEMP > PROBE_TEMP %}
    { action_respond_info('Extruder target %.1fC too high; lowering to %.1fC' % (TARGET_TEMP, PROBE_TEMP)) }
    M109 S{ PROBE_TEMP }
  {% else %}
    {% if ACTUAL_TEMP > MAX_TEMP %}
      { action_respond_info('Extruder %.1fC too high; waiting below %.1fC' % (ACTUAL_TEMP, MAX_TEMP)) }
      TEMPERATURE_WAIT SENSOR=extruder MAXIMUM={ MAX_TEMP }
    {% endif %}
  {% endif %}

#####################################################################
# Fans
#####################################################################

[fan]
pin: EBBCan:gpio13           # part cooling fan — controlled by slicer M106/M107

[heater_fan hotend_fan]
pin: EBBCan:gpio14           # heatsink fan — auto on when extruder > 70°C
heater: extruder
heater_temp: 50.0
kick_start_time: 0.5

[multi_pin m8p_ctrl_fans]
pins: PF7, PF8               # two M8P board fans wired together

[controller_fan m8p_controller_fans]
pin: multi_pin:m8p_ctrl_fans
kick_start_time: 0.5
shutdown_speed: 0.0
fan_speed: 0.60              # 60% — bump if board temps run high
idle_timeout: 180            # keep running 3 min after steppers/heaters go idle
heater: extruder, heater_bed
stepper: stepper_x, stepper_y, stepper_z, stepper_z1, stepper_z2, stepper_z3

[fan_generic exhaust_fan]
pin: PF9                     # rear exhaust — control manually: SET_FAN_SPEED FAN=exhaust_fan SPEED=1.0
kick_start_time: 0.5
shutdown_speed: 0.0

[fan_generic nevermore]
pin: PF6                     # carbon filter recirculator — runs during print, 5min cooldown after
kick_start_time: 0.5
off_below: 0.10

#####################################################################
# Accelerometer (ADXL345 on EBBCan)
# Run SHAPER_CALIBRATE to update input_shaper values in SAVE_CONFIG
# Current results: X=MZV 51Hz, Y=EI 46Hz (Y uses EI — check belt tension if Y degrades)
#####################################################################

[adxl345]
cs_pin: EBBCan:gpio1
spi_software_sclk_pin: EBBCan:gpio2
spi_software_mosi_pin: EBBCan:gpio0
spi_software_miso_pin: EBBCan:gpio3
axes_map: z,-y,x             # physical orientation of sensor on toolhead — don't change

[resonance_tester]
accel_chip: adxl345
probe_points: 175, 175, 20  # center of bed, low Z
accel_per_hz: 50             # reduced from 75 — CB1 struggles to process data at higher intensity

#####################################################################
# LEDs / Case Light
#####################################################################

[neopixel toolhead_light]
pin: EBBCan:gpio16           # Stealthburner 3-LED RGBW bar
chain_count: 3
color_order: GRBW

[output_pin caselight]
pin: PA3                     # PWM case light — LIGHT_ON / LIGHT_OFF macros
pwm: true
shutdown_value: 0
cycle_time: 0.01

#####################################################################
# Homing / Leveling
#####################################################################

[idle_timeout]
timeout: 1800                # 30 min — steppers and heaters off if idle

[safe_z_home]
home_xy_position: 175,175   # center of 350mm bed
speed: 100
z_hop: 5

[quad_gantry_level]
# 350mm build corners — do not change
gantry_corners:
  -60,-10
  410,420
points:                      # probe points — inset from edges for reliability
  50,50
  50,325
  300,325
  300,50
speed: 350
horizontal_move_z: 5
retries: 10
retry_tolerance: 0.0075      # tight — indicates well-tuned belt tension when it converges fast
max_adjust: 10

[bed_mesh]
mesh_min: 30, 30
mesh_max: 320, 320
probe_count: 5, 5            # 49 points — good coverage for 350mm bed
algorithm: bicubic
fade_start: 0.6              # start blending out mesh correction at 0.6mm
fade_end: 10.0               # fully off by 10mm — upper layers print on flat gantry plane



#####################################################################
# Board Pins (BTT mini12864 display)
#####################################################################

[board_pins]
aliases:
  EXP1_1=PE7,  EXP1_2=PG1,
  EXP1_3=PG0,  EXP1_4=PF15,
  EXP1_5=PF14, EXP1_6=PF13,
  EXP1_7=PF12, EXP1_8=PF11,
  EXP1_9=<GND>, EXP1_10=<5V>,
  EXP2_1=PE13, EXP2_2=PE12,
  EXP2_3=PE15, EXP2_4=PE11,
  EXP2_5=PE10, EXP2_6=PE14,
  EXP2_7=PE8,  EXP2_8=<RST>,
  EXP2_9=<GND>, EXP2_10=<NC>

#####################################################################
# Display (BTT mini12864)
#####################################################################

[display]
lcd_type: uc1701
cs_pin: EXP1_3
a0_pin: EXP1_4
rst_pin: EXP1_5
encoder_pins: ^EXP2_5, ^EXP2_3
click_pin: ^!EXP1_2
contrast: 63
spi_software_miso_pin: EXP2_1
spi_software_mosi_pin: EXP2_6
spi_software_sclk_pin: EXP2_2

[neopixel btt_mini12864]
pin: EXP1_6
chain_count: 3               # index 1=screen, 2=left knob, 3=right knob
initial_RED: 0.1
initial_GREEN: 0.5
initial_BLUE: 0.0
color_order: RGB

[delayed_gcode setdisplayneopixel]
initial_duration: 1          # runs 1s after boot to set display LED colors
gcode:
  SET_LED LED=btt_mini12864 RED=1 GREEN=1 BLUE=1 INDEX=1 TRANSMIT=0
  SET_LED LED=btt_mini12864 RED=1 GREEN=0 BLUE=0 INDEX=2 TRANSMIT=0
  SET_LED LED=btt_mini12864 RED=1 GREEN=0 BLUE=0 INDEX=3

#####################################################################
# Chamber Temperature Sensor (optional)
# Wire NTC 100K B3950 thermistor to TH0 (PA2) on M8P v2.0
# Mount inside enclosure mid-height on a side panel, away from bed
# Once installed: uncomment, then update PRINT_START to use:
#   TEMPERATURE_WAIT SENSOR="temperature_sensor chamber" MINIMUM=40
#####################################################################
# [temperature_sensor chamber]
# sensor_type: Generic 3950
# sensor_pin: PA2              # TH0 on M8P v2.0
# min_temp: 0
# max_temp: 100

#####################################################################
# Filament Sensor
# ! on pin required: EBBCan GPIO logic is inverted on this board.
# Disabled during homing/purge to prevent false triggers from retraction.
#####################################################################

# [filament_switch_sensor filament_sensor]
# switch_pin: ^!EBBCan:gpio21  # ^ = pull-up, ! = inverted (required for this EBBCan board)
# pause_on_runout: true
# event_delay: 3.0             # debounce — ignores repeated triggers within 3s
# pause_delay: 0.5             # wait 0.5s after detection before issuing PAUSE
# runout_gcode:
#   M117 Filament Runout
#   PAUSE
# insert_gcode:
#   M117 Filament Inserted

#####################################################################
# Macros
#####################################################################

[firmware_retraction]
retract_length: 0.8          # tune per filament — 0.5–1.0mm typical for direct drive
retract_speed: 30
unretract_extra_length: 0    # increase to 0.1–0.2 if you see gaps after travel moves
unretract_speed: 35


[gcode_macro G32]
description: Home, QGL, then move to center
gcode:
  {% set MV = printer.configfile.settings.printer.max_velocity|float %}
  {% set MA = printer.configfile.settings.printer.max_accel|int %}
  BED_MESH_CLEAR
  G90
  SET_VELOCITY_LIMIT VELOCITY=300 ACCEL=5000
  G28
  G1 Z20 F3000
  QUAD_GANTRY_LEVEL
  G28 Z
  G1 Z20 F3000
  G0 X175 Y175 Z30 F9000
  SET_VELOCITY_LIMIT VELOCITY={MV} ACCEL={MA}

[delayed_gcode nevermore_off]
gcode:
  SET_FAN_SPEED FAN=nevermore SPEED=0.0

[gcode_macro TOOLHEAD_LIGHT_RED]
gcode:
  SET_LED LED=toolhead_light RED=1 GREEN=0 BLUE=0 WHITE=0 TRANSMIT=1

[gcode_macro TOOLHEAD_LIGHT_OFF]
gcode:
  SET_LED LED=toolhead_light RED=0 GREEN=0 BLUE=0 WHITE=0 TRANSMIT=1

[gcode_macro LIGHT_ON]
gcode:
  SET_PIN PIN=caselight VALUE=1

[gcode_macro LIGHT_OFF]
gcode:
  SET_PIN PIN=caselight VALUE=0

[gcode_macro PRINT_START]
description: Heat bed fully, safe nozzle temp, G32/QGL, adaptive mesh, purge at print temp
gcode:
  {% set BED = params.BED|default(60)|int %}
  {% set EXTRUDER = params.EXTRUDER|default(210)|int %}

  UPDATE_DELAYED_GCODE ID=nevermore_off DURATION=0
  SET_FAN_SPEED FAN=nevermore SPEED=1.0

  LIGHT_ON
  TOOLHEAD_LIGHT_RED

  M140 S{BED}
  M104 S150

  M190 S{BED}
  TEMPERATURE_WAIT SENSOR=extruder MINIMUM=145 MAXIMUM=170

  G32
  # BED_MESH_CALIBRATE

  G90
  G1 Z20 F3000

  M109 S{EXTRUDER}

  # LINE_PURGE
  

[gcode_macro PRINT_END]
description: Safe end: firmware retract, lift, park, cooldown
gcode:
  SAVE_GCODE_STATE NAME=STATE_PRINT_END

  M400
  G92 E0
  G10

  {% set max_z = printer.toolhead.axis_maximum.z|float %}
  {% set cur_z = printer.toolhead.position.z|float %}
  {% set lift = 10.0 if cur_z < (max_z - 10.0) else (max_z - cur_z) %}

  G91
  G1 Z{lift} F1800
  G90

  {% set MV = printer.configfile.settings.printer.max_velocity|float %}
  {% set MA = printer.configfile.settings.printer.max_accel|int %}
  SET_VELOCITY_LIMIT VELOCITY=200 ACCEL=3000

  G0 X175 Y300 F9000         # park nozzle near back-center

  TURN_OFF_HEATERS
  LIGHT_OFF
  TOOLHEAD_LIGHT_OFF
  M107
  # BED_MESH_CLEAR

  UPDATE_DELAYED_GCODE ID=nevermore_off DURATION=300

  SET_VELOCITY_LIMIT VELOCITY={MV} ACCEL={MA}
  RESTORE_GCODE_STATE NAME=STATE_PRINT_END MOVE=0

