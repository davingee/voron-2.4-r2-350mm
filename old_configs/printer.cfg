#####################################################################
# Voron 2.4r2 350 - Formbot baseline
# Manta M8P v2.0 + CB1 (CAN)
# EBB SB2209 CAN (RP2040) (CAN)
# No USB->CAN bridge
# Physical X/Y endstops
# TAP probe as Z endstop
# Hotend temp: PT1000 (2-wire) via MAX31865 on SB2209 (software SPI)
#####################################################################

[include KAMP_Settings.cfg]
[include mainsail.cfg]
#####################################################################
# Macros
#####################################################################
[include printer_macros.cfg]
[include printer_stepper_moter.cfg]
[include printer_accelerometer.cfg]
[include printer_fan.cfg]
[exclude_object]

########################
# MCUs (CAN)
# ########################
[mcu]
canbus_uuid: 7cbf8eef4543
canbus_interface: can0


[mcu EBBCan]
canbus_uuid: fa817e71ef41
canbus_interface: can0

#####################################################################
# Printer Limits
#####################################################################
[printer]
kinematics: corexy
max_velocity: 300
# max_accel: 10000
max_accel: 3800
minimum_cruise_ratio: 0.5
max_z_velocity: 20
max_z_accel: 300
square_corner_velocity: 3.0

[temperature_sensor MP8]
sensor_type: temperature_mcu
sensor_mcu: mcu

[temperature_sensor CB1]
sensor_type: temperature_host

[temperature_sensor EBB]
sensor_type: temperature_mcu
sensor_mcu: EBBCan


#####################################################################
# Extruder (SB2209)
#####################################################################
[extruder]
step_pin: EBBCan:gpio18
dir_pin: EBBCan:gpio19              # add ! if direction is wrong
enable_pin: !EBBCan:gpio17
microsteps: 16
# rotation_distance: 22.3331
min_extrude_temp: 150
rotation_distance: 21.8864
gear_ratio: 50:10
nozzle_diameter: 0.400
filament_diameter: 1.750
# full_steps_per_rotation: 200 # Set to 400 for 0.9deg motors

heater_pin: EBBCan:gpio7
max_power: 1.0
## Pressure Advance (also big for clean walls)
pressure_advance: 0.04            # starter guess for direct drive
pressure_advance_smooth_time: 0.04

spi_speed: 400000
smooth_time: 0.5
sensor_type: MAX31865
sensor_pin: EBBCan:gpio9
spi_software_sclk_pin: EBBCan:gpio10
spi_software_mosi_pin: EBBCan:gpio8
spi_software_miso_pin: EBBCan:gpio11
rtd_nominal_r: 1000
rtd_reference_r: 4300
rtd_num_of_wires: 2
rtd_use_50hz_filter: false


min_temp: 0
max_temp: 280
max_extrude_only_distance: 105
max_extrude_cross_section: 5

[tmc2209 extruder]
uart_pin: EBBCan:gpio20
run_current: 0.65
interpolate: false
# sense_resistor: 0.110
# run_current: 0.6  # Adjust based on your pancake motor's rating (usually 0.6-0.65)
stealthchop_threshold: 0

[gcode_arcs]
resolution: 0.1

#####################################################################
# Bed Heater
#####################################################################
[heater_bed]
sensor_type: Generic 3950
heater_pin: PA1
sensor_pin: PB1
max_power: 1.0
min_temp: 0
max_temp: 115



#####################################################################
# Probe (TAP)
#####################################################################
[probe]
pin: ^EBBCan:gpio22
# x_offset: 0
# y_offset: 0
# z_offset: -1.0
speed: 10
lift_speed: 25
samples: 3
# samples_result: median
# sample_retract_dist: 3.0
# samples_tolerance: 0.010
# samples_tolerance_retries: 3

activate_gcode:
  {% set PROBE_TEMP = 150 %}
  {% set MAX_TEMP = PROBE_TEMP + 5 %}
  {% set ACTUAL_TEMP = printer.extruder.temperature %}
  {% set TARGET_TEMP = printer.extruder.target %}

  {% if TARGET_TEMP > PROBE_TEMP %}
    { action_respond_info('Extruder target %.1fC too high; lowering to %.1fC' % (TARGET_TEMP, PROBE_TEMP)) }
    M109 S{ PROBE_TEMP }
  {% else %}
    {% if ACTUAL_TEMP > MAX_TEMP %}
      { action_respond_info('Extruder %.1fC too high; waiting below %.1fC' % (ACTUAL_TEMP, MAX_TEMP)) }
      TEMPERATURE_WAIT SENSOR=extruder MAXIMUM={ MAX_TEMP }
    {% endif %}
  {% endif %}

#####################################################################
# LEDs / Case Light
#####################################################################
[neopixel toolhead_light]
pin: EBBCan:gpio16
chain_count: 3
color_order: GRBW

[output_pin caselight]
pin: PA3
pwm: true
shutdown_value: 0
cycle_time: 0.01

#####################################################################
# Homing / Leveling
#####################################################################
[idle_timeout]
timeout: 300

[safe_z_home]
home_xy_position: 175,175
speed: 100
z_hop: 10

[quad_gantry_level]
# 350mm build
gantry_corners:
  -60,-10
  410,420
points:
  50,50
  50,325   
  300,325
  300,50
speed: 300              # range: 150–350
horizontal_move_z: 10
retries: 10
retry_tolerance: 0.0075
max_adjust: 10

[bed_mesh]
mesh_min: 30, 30             # Offset slightly from the edges
mesh_max: 320, 320
probe_count: 7, 7            
algorithm: bicubic
fade_start: 0.6
fade_end: 10.0


#####################################################################
# Board Pins
#####################################################################
[board_pins]
aliases:
  # EXP1 header
  EXP1_1=PE7,  EXP1_2=PG1,
  EXP1_3=PG0,  EXP1_4=PF15,
  EXP1_5=PF14, EXP1_6=PF13,      # Slot in the socket on this side
  EXP1_7=PF12, EXP1_8=PF11,
  EXP1_9=<GND>, EXP1_10=<5V>,

  # EXP2 header
  EXP2_1=PE13, EXP2_2=PE12,
  EXP2_3=PE15, EXP2_4=PE11,
  EXP2_5=PE10, EXP2_6=PE14,      # Slot in the socket on this side
  EXP2_7=PE8,  EXP2_8=<RST>,
  EXP2_9=<GND>, EXP2_10=<NC>


#####################################################################
# 	Displays
#####################################################################

## 	Uncomment the display that you have
#--------------------------------------------------------------------

#[display]
##	RepRapDiscount 128x64 Full Graphic Smart Controller
#lcd_type: st7920
#cs_pin: EXP1_4
#sclk_pin: EXP1_5
#sid_pin: EXP1_3
#menu_timeout: 40
#encoder_pins: ^EXP2_5, ^EXP2_3
#click_pin: ^!EXP1_2

#[output_pin beeper]
#pin: EXP1_1

#--------------------------------------------------------------------
[filament_switch_sensor filament_sensor]
switch_pin: ^EBBCan:gpio21
pause_on_runout: true

runout_gcode:
    M117 Filament Runout
    PAUSE

insert_gcode:
    M117 Filament Inserted

[display]
#	mini12864 LCD Display
lcd_type: uc1701
cs_pin: EXP1_3
a0_pin: EXP1_4
rst_pin: EXP1_5
encoder_pins: ^EXP2_5, ^EXP2_3
click_pin: ^!EXP1_2
contrast: 63
spi_software_miso_pin: EXP2_1
spi_software_mosi_pin: EXP2_6
spi_software_sclk_pin: EXP2_2

[neopixel btt_mini12864]
#	To control Neopixel RGB in mini12864 display
pin: EXP1_6
chain_count: 3
initial_RED: 0.1
initial_GREEN: 0.5
initial_BLUE: 0.0
color_order: RGB

##	Set RGB values on boot up for each Neopixel. 
##	Index 1 = display, Index 2 and 3 = Knob
[delayed_gcode setdisplayneopixel]
initial_duration: 1
gcode:
       SET_LED LED=btt_mini12864 RED=1 GREEN=1 BLUE=1 INDEX=1 TRANSMIT=0
       SET_LED LED=btt_mini12864 RED=1 GREEN=0 BLUE=0 INDEX=2 TRANSMIT=0
       SET_LED LED=btt_mini12864 RED=1 GREEN=0 BLUE=0 INDEX=3



