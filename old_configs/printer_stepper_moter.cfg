#####################################################################
# X/Y Steppers
#####################################################################

## X Stepper on Motor1 (B Motor)
[stepper_x]
step_pin: PE6
dir_pin: PE5
enable_pin: !PC14
microsteps: 32
rotation_distance: 40
full_steps_per_rotation: 200        # set to 400 for 0.9° stepper
endstop_pin: ^EBBCan:gpio24
position_min: 0
position_endstop: 350
position_max: 350
homing_speed: 80
homing_retract_dist: 3
homing_positive_dir: true

[tmc2209 stepper_x]
uart_pin: PC13
interpolate: false
run_current: 1.3
# hold_current: 0.6
sense_resistor: 0.110
stealthchop_threshold: 0

## Y Stepper on Motor2 (A Motor)
[stepper_y]
step_pin: PE2
dir_pin: PE1
enable_pin: !PE4
microsteps: 32
rotation_distance: 40
full_steps_per_rotation: 200        # set to 400 for 0.9° stepper
endstop_pin: ^PF3
position_min: 0
position_endstop: 350
position_max: 350
homing_speed: 60
homing_retract_dist: 3
homing_positive_dir: true

[tmc2209 stepper_y]
uart_pin: PE3
interpolate: false
run_current: 1.3
# hold_current: 0.6
# hold_current: 0.7 # pausible drift so leave off for now but if motors get too hot lets use. on all motors to about 60–75% of run_current
sense_resistor: 0.110
stealthchop_threshold: 0

#####################################################################
# Z Steppers (Quad)
#####################################################################

## Z0 - Front Left on MOTOR3_A
[stepper_z]
step_pin: PB8
dir_pin: PB7
enable_pin: !PE0
rotation_distance: 40
gear_ratio: 80:16
microsteps: 16
endstop_pin: probe:z_virtual_endstop
position_max: 340
position_min: -2
homing_speed: 20
second_homing_speed: 8
homing_retract_dist: 2

[tmc2209 stepper_z]
uart_pin: PB9
interpolate: true
run_current: 1.0
hold_current: 0.6
sense_resistor: 0.110
stealthchop_threshold: 0

## Z1 - Rear Left on Motor5
[stepper_z1]
step_pin: PB4
dir_pin: !PB3
enable_pin: !PB6
rotation_distance: 40
gear_ratio: 80:16
microsteps: 16

[tmc2209 stepper_z1]
uart_pin: PB5
interpolate: true
run_current: 1.0
hold_current: 0.6
sense_resistor: 0.110
stealthchop_threshold: 0

## Z2 - Rear Right on Motor6
[stepper_z2]
step_pin: PG13
dir_pin: PG12
enable_pin: !PG15
rotation_distance: 40
gear_ratio: 80:16
microsteps: 16

[tmc2209 stepper_z2]
uart_pin: PG14
interpolate: true
run_current: 1.0
hold_current: 0.6
sense_resistor: 0.110
stealthchop_threshold: 0

## Z3 - Front Right on Motor7
[stepper_z3]
step_pin: PG9
dir_pin: !PD7
enable_pin: !PG11
rotation_distance: 40
gear_ratio: 80:16
microsteps: 16

[tmc2209 stepper_z3]
uart_pin: PG10
interpolate: true
run_current: 1.0
hold_current: 0.6
sense_resistor: 0.110
stealthchop_threshold: 0
