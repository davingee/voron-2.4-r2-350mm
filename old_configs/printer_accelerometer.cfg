# [adxl345]
# cs_pin: EBBCan: PB12
# spi_software_sclk_pin: EBBCan: PB10
# spi_software_mosi_pin: EBBCan: PB11
# spi_software_miso_pin: EBBCan: PB2
# axes_map: z,-y,x



[adxl345]
cs_pin: EBBCan:gpio1
spi_software_sclk_pin: EBBCan:gpio2
spi_software_mosi_pin: EBBCan:gpio0
spi_software_miso_pin: EBBCan:gpio3
# axes_map: z,-y,x
# axes_map: x, y, z
# axes_map: -z,y,x
axes_map: z,-y,x

[resonance_tester]
probe_points: 175, 175, 20
# probe_points: 175, 175, 120 # ringing higher up on tall prints, you might eventually want to test at Z=150  

accel_chip: adxl345
# the test shakes too hard
# Lower the test intensity:
accel_per_hz: 50 # moved from 75




# 2. Switch to a "Higher Speed" Shaper
# Currently, you are using MZV, which is great for quality but has a lower acceleration ceiling.
# ZV Shaper: As seen in your X-axis results, ZV allows for much higher acceleration (9,050 mm/s²) than MZV (6,300 mm/s²).
# Trade-off: ZV is less "forgiving" than MZV. If your belt tension drifts even slightly, you will see ringing return immediately.
# 3. Use a Higher accel_per_hz (If the CB1 allows)
# Now that you've stabilized your CB1 with accel_per_hz: 50, if you find your graphs are "noisy" or the peaks aren't sharp, try bumping it back up to 60 or 70 gradually. Sharper data helps the algorithm find a more aggressive (faster) shaper.
# 4. Configuration Changes
# If you want to force 10,000 right now, you must change your [printer] and [input_shaper] sections, but be prepared for "mushy" corners on the Y-axis:
# gcode
# [printer]
# max_accel: 10000
# max_accel_to_decel: 5000 # Recommended to set this to 50% of max_accel

# [input_shaper]
# # Note: These frequencies are from your 34Hz/46Hz results
# # 10k will exceed the 'Max Accel' recommended for these!
# shaper_type_x: mzv
# shaper_freq_x: 46.4
# shaper_type_y: mzv
# shaper_freq_y: 34.4
