[firmware_retraction]
retract_length: 0.6           # Start here (0.5–1.2 mm common sweet spot)
retract_speed: 30             # mm/s (30–50; slower reduces clicking)
unretract_extra_length: 0     # Usually 0; add 0.1–0.2 if restart blobs
unretract_speed: 35           # Same or slightly slower than retract
# lift_z: 0.2                   # <--- THIS IS YOUR Z-HOP

[gcode_macro G32]
description: Home, QGL at safer speeds, then move to center
gcode:
    {% set MV = printer.configfile.settings.printer.max_velocity|float %}
    {% set MA = printer.configfile.settings.printer.max_accel|int %}

    BED_MESH_CLEAR
    G90

    ; calm motion for homing/QGL
    SET_VELOCITY_LIMIT VELOCITY=200 ACCEL=3000

    G28
    G1 Z20 F3000
    QUAD_GANTRY_LEVEL
    G28 Z
    G1 Z20 F3000
    G0 X175 Y175 Z30 F6000

    ; restore normal limits
    SET_VELOCITY_LIMIT VELOCITY={MV} ACCEL={MA}



# SET_FAN_SPEED FAN=nevermore SPEED=1.0  ; Turn fan to 100%
# SET_FAN_SPEED FAN=nevermore SPEED=0    ; Turn fan off

[delayed_gcode nevermore_off]
gcode:
  SET_FAN_SPEED FAN=nevermore SPEED=0.0

[gcode_macro TOOLHEAD_LIGHT_RED]
gcode:
    # Set Stealthburner LEDs to Red
    # Adjust 'sb_leds' if your LED name is different in your config
    SET_LED LED=toolhead_light RED=1 GREEN=0 BLUE=0 WHITE=0 TRANSMIT=1

[gcode_macro TOOLHEAD_LIGHT_OFF]
gcode:
    SET_LED LED=toolhead_light RED=0 GREEN=0 BLUE=0 WHITE=0 TRANSMIT=1

[gcode_macro LIGHT_ON]
gcode:
    # Set Case Lights to 100%
    SET_PIN PIN=caselight VALUE=1

[gcode_macro LIGHT_OFF]
gcode:
    # Set Case Lights to 100%
    SET_PIN PIN=caselight VALUE=0


[gcode_macro PRINT_START]
description: Heat fully, G32/QGL, adaptive purge at print temp, ready
gcode:
  {% set BED = params.BED|default(60)|int %}
  {% set EXTRUDER = params.EXTRUDER|default(210)|int %}

  UPDATE_DELAYED_GCODE ID=nevermore_off DURATION=0
  SET_FAN_SPEED FAN=nevermore SPEED=1.0

  LIGHT_ON
  TOOLHEAD_LIGHT_RED

  M140 S{BED}                     ; start bed heating
  M104 S150                       ; hotend safe for probe/move
  TEMPERATURE_WAIT SENSOR=extruder MINIMUM=145 MAXIMUM=155

  G32                             ; home + QGL (your custom macro – good)
  G90
  G1 Z20 F3000

  M190 S{BED}                     ; wait bed full temp
  M109 S{EXTRUDER}                ; wait hotend full print temp (critical before purge!)
#   G1 Z5 F3000                   ; optional small lift before purge
  # Adaptive purge now at full temp (choose one; VORON_PURGE for logo, LINE_PURGE for simple line)
#   VORON_PURGE                     ; or LINE_PURGE if logo not wanted/enabled
  LINE_PURGE
  # Optional: small extra prime if purge feels light (rarely needed)
  # G92 E0
  # G1 E2 F300                    ; tiny extra if desired
  # G92 E0

  # Ready for slicer – no extra retract here (purge ends clean)

[gcode_macro PRINT_END]
description: Safe end: firmware retract, lift, slow park, cooldown
gcode:
  SAVE_GCODE_STATE NAME=STATE_PRINT_END

  M400                            ; wait moves finish
  G92 E0

  G10                             ; firmware retract (uses [firmware_retraction] values – consistent & clean)

  G91                             ; relative for lift
  G1 Z10 F1800                    ; lift Z (safe, no XY slam)

  G90                             ; back to absolute

  # Slow for gentle park (your original logic – excellent)
  {% set MV = printer.configfile.settings.printer.max_velocity|float %}
  {% set MA = printer.configfile.settings.printer.max_accel|int %}
  SET_VELOCITY_LIMIT VELOCITY=200 ACCEL=3000

  G0 X175 Y300 F9000              ; center-ish park away from back (good position)

  TURN_OFF_HEATERS
  LIGHT_OFF
  TOOLHEAD_LIGHT_OFF
  M107                            ; fans off
  BED_MESH_CLEAR

  UPDATE_DELAYED_GCODE ID=nevermore_off DURATION=120
  # Restore limits
  SET_VELOCITY_LIMIT VELOCITY={MV} ACCEL={MA}

  RESTORE_GCODE_STATE NAME=STATE_PRINT_END MOVE=0

# [gcode_macro PRINT_END]
# description: Safe end sequence (retract, lift, park, cool down) - no XY slam
# gcode:
#     SAVE_GCODE_STATE NAME=STATE_PRINT_END
#     M400
#     G92 E0
#     G1 E-3.0 F1800               ; smaller retract (safer than -10)
#     G91
#     G1 Z10 F1800                 ; lift Z only (no XY!)
#     G90

#     ; slow down for the park move (prevents banging)
#     {% set MV = printer.configfile.settings.printer.max_velocity|float %}
#     {% set MA = printer.configfile.settings.printer.max_accel|int %}
#     SET_VELOCITY_LIMIT VELOCITY=200 ACCEL=3000

#     ; park a bit away from the back just in case
