#####################################################################
# Fan Control
#####################################################################

## Part cooling (toolhead)
[fan]
pin: EBBCan:gpio13

## Hotend heatsink fan (toolhead)
[heater_fan hotend_fan]
pin: EBBCan:gpio14
heater: extruder
heater_temp: 70.0
kick_start_time: 0.5

[multi_pin m8p_ctrl_fans]
pins: PF7, PF8

# Automatically runs when steppers/heaters are active
[controller_fan m8p_controller_fans]
pin: multi_pin:m8p_ctrl_fans
kick_start_time: 0.5
shutdown_speed: 0.0

# Speed while active (0.0–1.0). Start here; bump up if needed.
fan_speed: 0.60

# Keep running this long after activity stops (seconds)
idle_timeout: 180

# Trigger conditions
heater: extruder, heater_bed
stepper: stepper_x, stepper_y, stepper_z, stepper_z1, stepper_z2, stepper_z3

# [fan_generic controller_fan_1]
# pin: PF7
# kick_start_time: 0.5
# shutdown_speed: 0.0

# [fan_generic controller_fan_2]
# pin: PF8
# kick_start_time: 0.5
# shutdown_speed: 0.0

[fan_generic exhaust_fan]
pin: PF9
kick_start_time: 0.5
shutdown_speed: 0.0


[fan_generic nevermore]
pin: PF6
kick_start_time: 0.5
off_below: 0.10
